<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sleepy Driver Detector</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #0F1B33; color: #fff; }
    #status { margin: 12px auto; width: 300px; padding: 12px; border-radius: 10px;
              font-size: 20px; font-weight: bold; background: #475569; }
    button { padding: 10px 24px; font-size: 18px; border-radius: 8px; cursor: pointer; }
    canvas { border-radius: 10px; margin-top: 12px; }
  </style>
</head>
<body>
  <h2>Sleepy Driver Detector</h2>
  <button id="startBtn" type="button" onclick="init()">Start</button>
  <div><canvas id="canvas"></canvas></div>
  <div id="status" style="display:none"></div>
  <div id="label-container"></div>

  <audio id="wakeUpAudio" loop>
    <source src="Alarm.mp3" type="audio/mpeg">
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
  <script>
    // ===== SETTINGS =====
    const URL = "https://teachablemachine.withgoogle.com/models/08uW06ifC/"; // your link
    // Any class whose name is in this list is treated as SAFE (green, no alarm).
    // Every other class (Distracted, Nodding Off, Looking at Phone, Head Tilt...) rings the alarm.
    const SAFE_CLASSES = ["neutral", "alert", "awake"];  // lowercase, case-insensitive match
    const DELAY_MS = 1500;         // grace period before the alarm rings

    let model, webcam, ctx, labelContainer, maxPredictions;
    let audio, statusBox;
    let notAlertSince = null;      // time when the driver stopped being alert

    async function init() {
      document.getElementById("startBtn").style.display = "none";
      audio = document.getElementById("wakeUpAudio");
      statusBox = document.getElementById("status");
      statusBox.style.display = "block";
      statusBox.innerHTML = "Loading model...";

      model = await tmPose.load(URL + "model.json", URL + "metadata.json");
      maxPredictions = model.getTotalClasses();

      const size = 300;
      const flip = true;
      webcam = new tmPose.Webcam(size, size, flip);
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);

      const canvas = document.getElementById("canvas");
      canvas.width = size;
      canvas.height = size;
      ctx = canvas.getContext("2d");

      labelContainer = document.getElementById("label-container");
      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
      const prediction = await model.predict(posenetOutput);

      // show all probabilities and find the top class
      let top = prediction[0];
      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.childNodes[i].innerHTML =
          prediction[i].className + ": " + prediction[i].probability.toFixed(2);
        if (prediction[i].probability > top.probability) top = prediction[i];
      }

      // Neutral = the top class is a safe class -> no alarm
      const isAlert = SAFE_CLASSES.includes(top.className.trim().toLowerCase());

      if (isAlert) {
        notAlertSince = null;
        audio.pause();
        statusBox.innerHTML = "NEUTRAL: Drive safe";
        statusBox.style.background = "#16a34a";
      } else {
        if (notAlertSince === null) notAlertSince = Date.now();
        statusBox.innerHTML = "Warning: " + top.className;
        statusBox.style.background = "#d97706";

        if (Date.now() - notAlertSince >= DELAY_MS) {
          audio.play().catch(function () {});
          statusBox.innerHTML = "WAKE UP! " + top.className;
          statusBox.style.background = "#dc2626";
        }
      }

      drawPose(pose);
    }

    function drawPose(pose) {
      if (webcam.canvas) {
        ctx.drawImage(webcam.canvas, 0, 0);
        if (pose) {
          const minPartConfidence = 0.5;
          tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
          tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
        }
      }
    }
  </script>
</body>
</html>
